services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPSFLOW_DATABASE_PATH: /app/data/opsflow.db
    volumes:
      - opsflow-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  opsflow-data:
